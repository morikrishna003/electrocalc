<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resistance Calculator - ElectroCalc</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>⚡ ElectroCalc</h1>
        <p><a href="../index.html" style="color: #cce5ff; text-decoration: none;">&larr; Back to Home</a></p>
    </header>

    <main>
        <h2>Series/Parallel Resistance</h2>
        
        <div class="calc-card">
            
            <label>Connection Type:</label>
            <select id="conn-type">
                <option value="series">Series Connection</option>
                <option value="parallel">Parallel Connection</option>
            </select>

            <label>R1 (Ohms):</label>
            <input type="number" id="r1" placeholder="Enter value">

            <label>R2 (Ohms):</label>
            <input type="number" id="r2" placeholder="Enter value">

            <label>R3 (Ohms) [Optional]:</label>
            <input type="number" id="r3" placeholder="Leave blank if not used">

            <label>R4 (Ohms) [Optional]:</label>
            <input type="number" id="r4" placeholder="Leave blank if not used">

            <button onclick="calculateResistance()">Calculate Total Resistance</button>

            <!-- રિઝલ્ટ બોક્સ -->
            <div id="result-box" style="margin-top: 20px; padding: 15px; background-color: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; text-align: center; color: #1e3a8a; display: none;">
            </div>
        </div>

        <!-- Formula સેક્શન -->
        <div class="calc-card">
            <h3 style="color: #1e3a8a; margin-bottom: 10px;">📖 Formula </h3>
            <p><strong>Series:</strong> R<sub>total</sub> = R1 + R2 + R3 + ...</p>
            <p><strong>Parallel:</strong> 1/R<sub>total</sub> = 1/R1 + 1/R2 + 1/R3 + ...</p>
        </div>
    </main>

    <script>
        function calculateResistance() {
            const type = document.getElementById('conn-type').value;
            // ખાલી બોક્સ હોય તો તેને 0 ગણવાને બદલે આપણે ગણતરીમાંથી કાઢી નાખીશું
            let r1 = parseFloat(document.getElementById('r1').value);
            let r2 = parseFloat(document.getElementById('r2').value);
            let r3 = parseFloat(document.getElementById('r3').value);
            let r4 = parseFloat(document.getElementById('r4').value);
            const resultBox = document.getElementById('result-box');

            if (isNaN(r1) || isNaN(r2)) {
                alert("Please enter at least R1 and R2 values.");
                return;
            }

            // બધા વેલિડ અવરોધોનું લિસ્ટ બનાવો
            let resistors = [r1, r2];
            if (!isNaN(r3) && r3 > 0) resistors.push(r3);
            if (!isNaN(r4) && r4 > 0) resistors.push(r4);

            let rTotal = 0;

            if (type === 'series') {
                for (let r of resistors) {
                    rTotal += r;
                }
            } else {
                let rParallelInverse = 0;
                for (let r of resistors) {
                    if (r === 0) {
                        alert("Resistance in parallel cannot be zero.");
                        return;
                    }
                    rParallelInverse += (1 / r);
                }
                rTotal = 1 / rParallelInverse;
            }

            resultBox.innerHTML = `
                <div style="font-size: 16px; margin-bottom: 8px;">Total Equivalent Resistance:</div>
                <div style="font-size: 28px; font-weight: bold;">${rTotal.toFixed(2)} &Omega;</div>
            `;
            resultBox.style.display = 'block';
        }
    </script>
</body>
</html>
