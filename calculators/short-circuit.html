<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Short-Circuit Calculator - ElectroCalc</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>⚡ ElectroCalc</h1>
        <p><a href="../index.html" style="color: #cce5ff; text-decoration: none;">&larr; Back to Home</a></p>
    </header>

    <main>
        <h2>Transformer Short-Circuit Current</h2>
        
        <div class="calc-card">
            
            <label>Transformer Rating (kVA):</label>
            <input type="number" id="kva" placeholder="e.g. 500">

            <label>Secondary Voltage (Line-to-Line V):</label>
            <input type="number" id="voltage" placeholder="e.g. 415">

            <label>Transformer Impedance (%Z):</label>
            <input type="number" id="impedance" placeholder="e.g. 4.5" step="0.1">

            <button onclick="calculateIsc()">Calculate Short-Circuit Current (Isc)</button>

            <!-- રિઝલ્ટ બોક્સ -->
            <div id="result-box" style="margin-top: 20px; padding: 15px; background-color: #eff6ff; border: 1px solid #bfdbfe; border-radius: 8px; text-align: center; color: #1e3a8a; display: none;">
            </div>
        </div>

        <!-- Formula સેક્શન -->
        <div class="calc-card">
            <h3 style="color: #1e3a8a; margin-bottom: 10px;">📖 Formula </h3>
            <p><strong>Full Load Current (I<sub>FLA</sub>)</strong> = (kVA &times; 1000) &divide; (&radic;3 &times; V)</p>
            <p><strong>Short-Circuit Current (I<sub>SC</sub>)</strong> = I<sub>FLA</sub> &times; (100 &divide; %Z)</p>
            <hr style="margin: 15px 0; border-top: 1px solid #e2e8f0;">
            <p style="font-size: 13px; color: #64748b;">
                * Assumes standard 3-Phase Transformer.<br>
                * %Z (Percentage Impedance) is found on the transformer nameplate.
            </p>
        </div>
    </main>

    <script>
        function calculateIsc() {
            const kva = parseFloat(document.getElementById('kva').value);
            const voltage = parseFloat(document.getElementById('voltage').value);
            const impedance = parseFloat(document.getElementById('impedance').value);
            const resultBox = document.getElementById('result-box');

            if (isNaN(kva) || isNaN(voltage) || isNaN(impedance) || voltage === 0 || impedance === 0) {
                alert("Please enter valid numbers. Voltage and Impedance cannot be zero.");
                return;
            }

            // 3-Phase Full Load Current
            const root3 = 1.732;
            const iFla = (kva * 1000) / (root3 * voltage);

            // Short Circuit Current
            const iSc = iFla * (100 / impedance);
            
            // kA માં રૂપાંતર
            const iSc_kA = iSc / 1000;

            resultBox.innerHTML = `
                <div style="font-size: 14px; color: #475569; margin-bottom: 8px;">Full Load Current (I<sub>FLA</sub>): <strong>${iFla.toFixed(2)} A</strong></div>
                <div style="font-size: 16px; margin-bottom: 8px; margin-top: 15px; font-weight: bold;">Short-Circuit Current (I<sub>SC</sub>):</div>
                <div style="font-size: 32px; font-weight: bold; color: #dc2626;">${iSc.toFixed(2)} A</div>
                <div style="font-size: 16px; color: #dc2626; font-weight: bold;">(or ${iSc_kA.toFixed(2)} kA)</div>
            `;
            resultBox.style.display = 'block';
        }
    </script>
</body>
</html>
