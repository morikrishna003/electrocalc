<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kW to HP Calculator - ElectroCalc</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>ElectroCalc</h1>
        <p><a href="../index.html" style="color: #cce5ff; text-decoration: none;">&larr; Back to Home</a></p>
    </header>

    <main>
        <h2>kW ↔ HP Calculator</h2>
        
        <div class="calc-card">
            <label><strong>Select Conversion:</strong></label>
            <select id="calc-type" style="width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; font-size: 16px;">
                <option value="kw-to-hp">Kilowatt (kW) to Horsepower (HP)</option>
                <option value="hp-to-kw">Horsepower (HP) to Kilowatt (kW)</option>
            </select>

            <div style="margin-top: 15px;">
                <label id="input-label">Enter Power in kW:</label>
                <input type="number" id="input-val" placeholder="Enter value" style="width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc; font-size: 16px;">
            </div>

            <button onclick="calculatePower()" style="width: 100%; padding: 12px; margin-top: 20px; background-color: #0056b3; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold;">Calculate</button>

            <!-- રિઝલ્ટ બોક્સ -->
            <div id="result-box" style="margin-top: 20px; padding: 15px; background-color: #e2f0d9; border: 1px solid #c3e6cb; border-radius: 5px; text-align: center; font-size: 20px; font-weight: bold; color: #155724; display: none;">
            </div>
        </div>

        <!-- Formula સેક્શન -->
        <div class="calc-card" style="margin-top: 20px;">
            <h3 style="margin-bottom: 15px;">📖 Formula </h3>
            <p><strong>1 HP (Electrical)</strong> = 0.746 kW</p>
            <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">
            <p><strong>kW to HP:</strong> HP = kW &divide; 0.746</p>
            <p><strong>HP to kW:</strong> kW = HP &times; 0.746</p>
        </div>
    </main>

    <script>
        const calcType = document.getElementById('calc-type');
        const inputLabel = document.getElementById('input-label');
        const inputVal = document.getElementById('input-val');
        const resultBox = document.getElementById('result-box');

        // ડ્રોપડાઉન બદલવા પર લેબલ બદલાશે
        calcType.addEventListener('change', function() {
            inputVal.value = '';
            resultBox.style.display = 'none';

            if (this.value === 'kw-to-hp') {
                inputLabel.innerText = 'Enter Power in kW:';
            } else {
                inputLabel.innerText = 'Enter Power in HP:';
            }
        });

        // ગણતરી
        function calculatePower() {
            const type = calcType.value;
            const val = parseFloat(inputVal.value);

            if (isNaN(val)) {
                alert("Please enter a valid number!");
                return;
            }

            let resultText = "";
            const factor = 0.746;

            if (type === 'kw-to-hp') {
                const hp = val / factor;
                resultText = `Result: ${hp.toFixed(2)} HP`;
            } else {
                const kw = val * factor;
                resultText = `Result: ${kw.toFixed(2)} kW`;
            }

            resultBox.innerHTML = resultText;
            resultBox.style.display = 'block';
        }
    </script>
</body>
</html>
